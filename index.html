
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello, Universe</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#060713;color:white;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh}
.overlay{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
h1{font-size:clamp(35px,7vw,100px);letter-spacing:-.07em;margin:0;text-align:center;text-shadow:0 0 50px #a5b4fc88}
h1 span{color:#a5b4fc}
p{text-align:center;color:#a7a8c0;font-size:13px;letter-spacing:3px;margin-top:20px}
footer{position:fixed;bottom:30px;width:100%;text-align:center;color:#777b99;font-size:12px;letter-spacing:2px}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="overlay">
<div><h1>hello<span> world.</span></h1><p>YOU ARE SOMEWHERE IN THE UNIVERSE</p></div>
</div>
<footer>MOVE TO BEND GRAVITY · CLICK TO MAKE A WISH</footer>
<script>
const c=document.querySelector("canvas"),ctx=c.getContext("2d");
let W,H,t=0,stars=[],comets=[],mouse={x:-9999,y:-9999};
function resize(){
 W=c.width=innerWidth;H=c.height=innerHeight;
 stars=Array.from({length:240},()=>({
 x:Math.random()*W,y:Math.random()*H,
 r:Math.random()*1.6+.2,z:Math.random()*2+.3,
 phase:Math.random()*7
 }));
}
resize();addEventListener("resize",resize);
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("pointerleave",()=>{mouse.x=-9999;mouse.y=-9999});
addEventListener("pointerdown",e=>{
 for(let i=0;i<35;i++){
 let a=Math.random()*Math.PI*2,s=Math.random()*7+2;
 comets.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*s,
 vy:Math.sin(a)*s,life:1,hue:180+Math.random()*130});
 }
});
function draw(){
 t+=.008;ctx.fillStyle="#060713";ctx.fillRect(0,0,W,H);
 let cx=W/2,cy=H/2,r=Math.min(W,H)*.33;
 let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2);
 glow.addColorStop(0,"#4544a329");glow.addColorStop(.5,"#24226b12");
 glow.addColorStop(1,"#06071300");
 ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 for(let s of stars){
 let dx=mouse.x-s.x,dy=mouse.y-s.y,d=Math.hypot(dx,dy);
 let pull=Math.max(0,1-d/250)*22;
 let x=s.x+(d?dx/d*pull:0)+Math.sin(t+s.phase)*s.z;
 let y=s.y+(d?dy/d*pull:0)+Math.cos(t+s.phase)*s.z;
 ctx.beginPath();ctx.arc(x,y,s.r,0,Math.PI*2);
 ctx.fillStyle=`rgba(205,211,255,${.3+.5*(1+Math.sin(t*3+s.phase))/2})`;
 ctx.fill();
 }
 for(let i=0;i<3;i++){
 ctx.beginPath();ctx.ellipse(cx,cy,r*(.8+i*.2),
 r*(.25+i*.08),-.35+t*.1,0,Math.PI*2);
 ctx.strokeStyle=`rgba(155,140,255,${.12-i*.025})`;
 ctx.lineWidth=1.5;ctx.stroke();
 }
 comets=comets.filter(p=>p.life>0);
 for(let p of comets){
 ctx.beginPath();ctx.moveTo(p.x,p.y);
 ctx.lineTo(p.x-p.vx*4,p.y-p.vy*4);
 ctx.strokeStyle=`hsla(${p.hue},100%,75%,${p.life})`;
 ctx.lineWidth=2;ctx.stroke();
 p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;p.life-=.015;
 }
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
